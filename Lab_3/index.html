<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator 3 - Acasă</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light"> <div class="container">
        <nav>
            <a href="index.html">Acasă</a> | 
            <a href="preferences.html">Preferințe</a> | 
            <a href="cookies-info.html">Info Cookies</a> | 
            <a href="login.html">Autentificare</a>
        </nav>

        <hr>

        <h1 id="welcomeMessage">Bun venit, Vizitator!</h1>
        <p>Ai vizitat această pagină de <strong id="visitCount">0</strong> ori.</p>

        <button id="clearAllBtn" class="btn-danger">Șterge Tot (Cookies & Storage)</button>

        <hr>

        <h2>Cookie-uri Active</h2>
        <table border="1" id="cookiesTable">
            <tr><th>Nume</th><th>Valoare</th></tr>
        </table>

        <h2>Date în LocalStorage</h2>
        <table border="1" id="localTable">
            <tr><th>Cheie</th><th>Valoare</th></tr>
        </table>

        <h2>Date în SessionStorage</h2>
        <table border="1" id="sessionTable">
            <tr><th>Cheie</th><th>Valoare</th></tr>
        </table>
    </div>

    <script src="js/cookies.js"></script>
    <script src="js/storage.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            //  Bun venit 
            let username = CookieManager.get('username') || 'Vizitator';
            document.getElementById('welcomeMessage').innerText = `Bun venit, ${username}!`;

            // Nr de vizite
            let visits = parseInt(CookieManager.get('visits')) || 0;
            visits += 1;
            CookieManager.set('visits', visits, 365);
            document.getElementById('visitCount').innerText = visits;

            // Aplica tema salvata de utilizator
            let theme = CookieManager.get('theme') || 'light';
            document.body.className = theme;

            // Funcție ajutătoare pentru a umple tabelele
            function populateTable(tableId, dataObject) {
                const table = document.getElementById(tableId);
                for (const [key, value] of Object.entries(dataObject)) {
                    const row = table.insertRow();
                    const cellKey = row.insertCell(0);
                    const cellValue = row.insertCell(1);
                    cellKey.innerText = key;
                    
                    // Verificăm dacă valoarea este obiect (pentru JSON) și o afișăm corespunzător
                    if (typeof value === 'object' && value !== null) {
                        cellValue.innerText = JSON.stringify(value);
                    } else {
                        cellValue.innerText = value;
                    }
                }
            }

            //Afișarea datelor în tabele
            populateTable('cookiesTable', CookieManager.getAll());
            populateTable('localTable', StorageManager.getAllLocal());
            populateTable('sessionTable', StorageManager.getAllSession());

            //Butonul "Șterge Tot"
            document.getElementById('clearAllBtn').addEventListener('click', () => {
                CookieManager.deleteAll();
                StorageManager.clearLocal();
                StorageManager.clearSession();
                alert('Toate datele au fost șterse!');
                location.reload(); // Reîncărcăm pagina pentru a vedea efectele
            });
        });
    </script>
</body>
</html>
